name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, mbstring
          coverage: none
      # The client is taken from its GitHub tags, so a new client version is testable before Packagist picks it.
      - run: composer config repositories.yatmo-php vcs https://github.com/Yatmo/yatmo-php
      - run: composer install --no-interaction --prefer-dist
      - run: composer test
